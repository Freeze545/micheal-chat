services:
  - type: web
    name: micheal-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b
      - key: OPENAI_API_KEY
        sync: false
