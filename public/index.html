<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micheal — Assistant Cloud</title>
  <meta name="description" content="Micheal, assistant intelligent propulsé par le cloud pour Lucas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="36" height="36">
            <defs>
              <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5b8def"/>
                <stop offset="100%" stop-color="#3d6fd9"/>
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" fill="url(#cloudGrad)" opacity="0.2"/>
            <path d="M12 22c0-3.3 2.5-6 5.6-6 0.4-2.4 2.5-4.2 5-4.2 2.8 0 5.1 2.2 5.2 5 2.1 0.3 3.7 2.1 3.7 4.3 0 2.4-2 4.4-4.4 4.4H16.4C14 25.5 12 23.5 12 21.1z" fill="url(#cloudGrad)"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name" id="sidebarName">Micheal</span>
          <span class="brand-sub">Assistant Cloud</span>
        </div>
      </div>

      <button type="button" class="btn-new-chat" id="btnNewChat" title="Nouvelle conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle conversation
      </button>

      <div class="sidebar-meta">
        <div class="status-pill" id="statusPill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusLabel">Connexion…</span>
        </div>
        <p class="sidebar-hint">Propulsé par le cloud · Québec</p>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="btn-ghost" id="btnOpenSettings" aria-label="Paramètres">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
          Paramètres
        </button>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="main">
      <header class="chat-header">
        <button type="button" class="btn-icon mobile-only" id="btnToggleSidebar" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="header-identity">
          <img src="/avatar.jpg" alt="Micheal" class="header-avatar" id="headerAvatar" width="40" height="40" />
          <div>
            <h1 class="header-name" id="headerName">Micheal</h1>
            <p class="header-status" id="headerStatus">
              <span class="live-dot"></span>
              En ligne · Cloud
            </p>
          </div>
        </div>
        <button type="button" class="btn-icon" id="btnOpenSettingsHeader" aria-label="Paramètres" title="Paramètres">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <!-- filled by JS -->
      </div>

      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <textarea
            id="input"
            rows="1"
            placeholder="Écris un message à Micheal…"
            aria-label="Message"
          ></textarea>
          <button type="submit" class="btn-send" id="btnSend" aria-label="Envoyer" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
        <p class="composer-footnote">Micheal peut faire des erreurs. Vérifie les infos importantes.</p>
      </div>
    </main>
  </div>

  <!-- Settings panel -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true" role="dialog" aria-labelledby="settingsTitle">
    <div class="settings-header">
      <h2 id="settingsTitle">Paramètres</h2>
      <button type="button" class="btn-icon" id="btnCloseSettings" aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <label class="field">
        <span class="field-label">Nom affiché</span>
        <input type="text" id="settingName" maxlength="40" placeholder="Micheal" />
      </label>
      <label class="field">
        <span class="field-label">Personnalité (résumé)</span>
        <input type="text" id="settingPersonality" maxlength="120" placeholder="Professionnel, clair, québécois casual" />
      </label>
      <label class="field">
        <span class="field-label">Prompt système</span>
        <textarea id="settingSystem" rows="8" placeholder="Instructions pour Micheal…"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Température <span id="tempValue">0.7</span></span>
        <input type="range" id="settingTemp" min="0" max="1.5" step="0.1" value="0.7" />
      </label>
      <div class="settings-actions">
        <button type="button" class="btn-secondary" id="btnResetSettings">Réinitialiser</button>
        <button type="button" class="btn-primary" id="btnSaveSettings">Enregistrer</button>
      </div>
      <p class="settings-note">Les réglages sont sauvegardés localement dans ton navigateur.</p>
    </div>
  </aside>

  <script src="/js/app.js" defer></script>
</body>
</html>
